[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-input-location-normalization"
version = "0.1.0"
description = "Deterministic country-level normalization of user-input location strings."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Carlos R. Arruda" }]
keywords = [
    "geocoding",
    "location",
    "normalization",
    "user-generated-content",
    "preprocessing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "geopy>=2.4",
]

[project.urls]
Repository = "https://github.com/crarruda/user-input-location-normalization"

# The package directory matches the install-time import name.
[tool.setuptools]
packages = ["location_normalization"]
